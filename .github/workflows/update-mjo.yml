
name: update-mjo
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_mjo.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add mjo.json
          git diff --cached --quiet || (git commit -m "MJO data update" && git push)
          
